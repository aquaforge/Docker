global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'system_monitor'
    static_configs:
      - targets: ['docker-links:80']
    metrics_path: '/metrics'
    scrape_interval: 1s

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 1s