apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      httpHeaderName1: "X-Scope-OrgID"
      derivedFields:
        - name: "traceID"
          matcherRegex: "trace_id=(\\w+)"
          url: "http://tempo:3200/trace/$${__value.raw}"
    isDefault: true
    version: 1
    editable: true