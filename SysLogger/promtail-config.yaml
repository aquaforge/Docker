server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system_metrics
          app: sys_logger
          __path__: /logs/*.log
    pipeline_stages:
      # 1. Проверяем, что это JSON (если нет - пропускаем)
      - match:
          selector: '{app="sys_logger"}'
          stages:
            - json:
                expressions:
                  cpu_temp: cpu_temp
                  cpu_usage: cpu_usage
                  memory_usage: memory_usage
                  disk_usage: disk_usage
                  timestamp: timestamp
      
      # 2. Добавляем метки
      - labels:
          cpu_usage: cpu_usage
      
      # 3. Преобразуем timestamp
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.999"
      
      # 4. Статические метки
      - static_labels:
          source: "sys_logger"
          environment: "production"
      
      # 5. Удаляем пустые поля (если были ошибки парсинга)
      - replace:
          expression: ',+'
          replace: ','
          # Это исправляет двойные запятые в JSON если какие-то поля пропущены