server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system_metrics
          app: python-logger
          __path__: /logs/*.log
    pipeline_stages:
      # Парсим строки в формате key=value pairs
      - regex:
          expression: 'timestamp=(?P<timestamp>[^\s]+)\s+cpu_temp=(?P<cpu_temp>[^\d.]+)°C\s+cpu_usage=(?P<cpu_usage>[^\s]+)\s+memory_usage=(?P<memory_usage>[^\s]+)\s+disk_usage=(?P<disk_usage>[^\s]+)'
      
      # Добавляем извлеченные значения как метки (лейблы)
      - labels:
          cpu_temp: cpu_temp
          cpu_usage: cpu_usage
          memory_usage: memory_usage
          disk_usage: disk_usage
      
      # Преобразуем timestamp в правильный формат для Loki
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.999"
      
      # Удаляем исходный timestamp из сообщения, чтобы не дублировать
      - replace:
          expression: 'timestamp=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}\s+'
          replace: ''
      
      # Добавляем дополнительные метаданные
      - static_labels:
          source: "python-app"
          environment: "production"